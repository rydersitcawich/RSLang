[project]
name = "mini-inference"
version = "0.1.0"
description = "A from-scratch mini LLM inference engine (learning project)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "numpy",
    "pyyaml",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]
bench = ["mlx", "mlx-lm"]
serve = ["fastapi", "uvicorn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mini_inference*"]
